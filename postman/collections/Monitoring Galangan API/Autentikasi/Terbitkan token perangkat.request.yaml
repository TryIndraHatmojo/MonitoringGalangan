$kind: http-request
description: Akun biasa memakai galangan akun jika slug tidak dikirim. Administrator Pusat wajib memilih slug galangan. Penerbitan ulang mengganti token perangkat untuk galangan tersebut.
url: '{{baseUrl}}/auth/tokens'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
auth:
  type: noauth
body:
  type: json
  content: '{}'
examples: './.resources/Terbitkan token perangkat.resources/examples'
order: 1000
scripts:
  - type: beforeRequest
    code: |-
      const organization = pm.environment.get('organization');
      pm.request.body.update(JSON.stringify({
        email: pm.environment.get('email'),
        password: pm.environment.get('password'),
        ...(organization ? { organization } : {}),
        device_id: pm.environment.get('deviceId'),
        device_name: 'Postman lokal',
      }));
  - type: afterResponse
    code: |-
      pm.test('Token perangkat terbit', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) {
        const { data } = pm.response.json();
        pm.test('Skema token bearer dan batas berlaku', () => {
          pm.expect(data.token_type).to.eql('Bearer');
          pm.expect(data.token).to.be.a('string').and.not.empty;
          pm.expect(Date.parse(data.expires_at)).to.be.above(Date.now());
        });
        pm.collectionVariables.set('bearerToken', data.token);
      }
