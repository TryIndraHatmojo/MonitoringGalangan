$kind: http-example
name: Token terbit. Simpan nilai token saat diterima.
request:
  url: "{{baseUrl}}/auth/tokens"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "email": "admin@example.test",
        "password": "<sandi-lokal>",
        "organization": "ferry-demo",
        "device_id": "postman-local",
        "device_name": "Postman lokal"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "token": "string",
          "token_type": "string",
          "expires_at": "1997-03-12T16:34:00.206Z"
        }
      }
order: 1000
