$kind: http-example
name: Batas permintaan tercapai.
request:
  url: "{{baseUrl}}/auth/tokens"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "email": "admin@example.test",
        "password": "<sandi-lokal>",
        "organization": "ferry-demo",
        "device_id": "postman-local",
        "device_name": "Postman lokal"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: X-Request-Id
      value: 5e5b16bc-1d51-179e-ae12-269177e4e0f7
      disabled: false
      description: ID untuk penelusuran error.
    - key: Retry-After
      value: "7655"
      disabled: false
      description: Detik sebelum percobaan berikutnya.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "request_failed",
          "message": "string",
          "request_id": "25aa2b96-3fdb-2512-babb-c33ff2c0dd67",
          "fields": {
            "key_0": [
              "string",
              "string"
            ],
            "key_1": [
              "string",
              "string"
            ]
          }
        }
      }
order: 4000
