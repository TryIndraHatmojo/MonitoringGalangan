$kind: http-request
url: '{{baseUrl}}/me'
method: GET
headers:
  Accept: application/json
examples: './.resources/Lihat profil dan cakupan token.resources/examples'
order: 2000
scripts:
  - type: afterResponse
    code: |-
      pm.test('Profil berada dalam organisasi token', () => {
        pm.response.to.have.status(200);
        const { data } = pm.response.json();
        const organization = pm.environment.get('organization');
        pm.expect(data.organization.slug).to.be.a('string').and.not.empty;
        if (organization) pm.expect(data.organization.slug).to.eql(organization);
        pm.expect(data.permissions).to.be.an('array').that.includes('projects.view');
      });
