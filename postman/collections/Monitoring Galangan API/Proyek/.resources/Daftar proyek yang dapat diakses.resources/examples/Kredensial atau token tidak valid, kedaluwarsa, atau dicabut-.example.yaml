$kind: http-example
name: Kredensial atau token tidak valid, kedaluwarsa, atau dicabut.
request:
  url: "{{baseUrl}}/projects?page=1&per_page=25"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  queryParams:
    page: "1"
    per_page: "25"
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: X-Request-Id
      value: 5e5b16bc-1d51-179e-ae12-269177e4e0f7
      disabled: false
      description: ID untuk penelusuran error.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "validation_failed",
          "message": "string",
          "request_id": "fe40f108-cc1f-2933-514f-0135eee892da",
          "fields": {
            "key_0": [
              "string",
              "string"
            ],
            "key_1": [
              "string",
              "string"
            ],
            "key_2": [
              "string",
              "string"
            ]
          }
        }
      }
order: 2000
