$kind: http-example
name: Resource tidak tersedia dalam cakupan token atau baseline periode.
request:
  url: "{{baseUrl}}/projects/:projectId"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: projectId
      value: 01KBMTRREGSW4PG4TGVJF0KA1Y
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
