  statusCode: 404
  statusText: Not Found
  headers:
    - key: X-Request-Id
      value: 5e5b16bc-1d51-179e-ae12-269177e4e0f7
      disabled: false
      description: ID untuk penelusuran error.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "request_failed",
          "message": "string",
          "request_id": "25aa2b96-3fdb-2512-babb-c33ff2c0dd67",
          "fields": {
            "key_0": [
              "string",
              "string"
            ],
            "key_1": [
              "string",
              "string"
            ]
          }
        }
      }
order: 3000
