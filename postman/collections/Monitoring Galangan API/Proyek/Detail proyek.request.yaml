$kind: http-request
url: '{{baseUrl}}/projects/:projectId'
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: projectId
    value: '{{activeProjectId}}'
examples: './.resources/Detail proyek.resources/examples'
order: 2000
scripts:
  - type: afterResponse
    code: |-
      pm.test('Detail menggunakan ID proyek dari daftar', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.id).to.eql(pm.collectionVariables.get('activeProjectId'));
      });
